<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页媒体 · Vela</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* 面板容器都带作者 display（grid/flex），会压掉 UA 的 [hidden]——
     显式补一条，否则 tab 切换 / 悬停单媒体模式下隐藏面板全部失效叠着显示 */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font: 13.5px/1.5 system-ui, "Segoe UI", sans-serif;
    background: #f6f6f8; color: #1f2024;
  }
  @media (prefers-color-scheme: dark) { body { background: #17181c; color: #e6e6ea; } }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; background: #fff; border-bottom: 1px solid #e4e4ea;
  }
  @media (prefers-color-scheme: dark) { header { background: #1e1f24; border-color: #2c2d33; } }
  header strong { font-size: 14px; }
  #om-media-page { color: #6b6d78; font-size: 12px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .om-media-status { color: #6b6d78; font-size: 12px; }
  .om-media-status.om-media-err { color: #d5484f; }
  .om-media-spacer { flex: 1; }
  header button {
    border: 1px solid #d9dae2; background: #fff; color: inherit; border-radius: 6px;
    padding: 4px 10px; font: 12px/1 inherit; cursor: pointer;
  }
  header button:hover { border-color: #6841EA; color: #6841EA; }
  header .om-media-tab.on { background: #6841EA; border-color: #6841EA; color: #fff; }
  @media (prefers-color-scheme: dark) {
    header button { background: #26272c; border-color: #3a3b42; }
    header .om-media-tab.on { background: #6841EA; color: #fff; }
  }

  main { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
  .om-media-empty { color: #6b6d78; text-align: center; padding: 40px 10px; }

  /* 图片网格卡 */
  #om-media-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  .om-media-card {
    background: #fff; border: 1px solid #e4e4ea; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (prefers-color-scheme: dark) { .om-media-card { background: #1e1f24; border-color: #2c2d33; } }
  .om-media-thumb {
    height: 108px; background: #eceef2 center/contain no-repeat; cursor: zoom-in; flex: none;
    display: flex; align-items: center; justify-content: center; color: #8f91a0; font-size: 22px;
  }
  @media (prefers-color-scheme: dark) { .om-media-thumb { background: #26272c; } }
  .om-media-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .om-media-meta { padding: 5px 9px 0; color: #6b6d78; font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .om-media-meta .om-media-tag { background: #eceef2; border-radius: 4px; padding: 0 5px; }
  @media (prefers-color-scheme: dark) { .om-media-meta .om-media-tag { background: #2c2d33; } }
  .om-media-acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 9px 9px; }
  .om-media-acts button {
    border: 1px solid #d9dae2; background: none; color: inherit; border-radius: 6px;
    padding: 3px 9px; font: 12px/1.4 inherit; cursor: pointer;
  }
  .om-media-acts button:hover:not(:disabled) { border-color: #6841EA; color: #6841EA; }
  .om-media-acts button:disabled { opacity: .45; cursor: default; }
  .om-media-acts button.om-media-run { border-color: #6841EA; color: #6841EA; }
  .om-media-acts button.om-media-run:hover:not(:disabled) { background: #6841EA; color: #fff; }

  /* 视频条目（横条卡） */
  #om-media-videos, #om-media-embeds { display: flex; flex-direction: column; gap: 10px; }
  .om-media-vcard {
    background: #fff; border: 1px solid #e4e4ea; border-radius: 10px; padding: 9px 11px;
    display: flex; flex-direction: column; gap: 6px;
  }
  @media (prefers-color-scheme: dark) { .om-media-vcard { background: #1e1f24; border-color: #2c2d33; } }
  .om-media-vhead { display: flex; align-items: center; gap: 8px; }
  .om-media-vhead .om-media-vicon {
    width: 34px; height: 24px; border-radius: 5px; background: #17181c; color: #fff; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .om-media-vhead .om-media-vsrc { flex: 1; min-width: 0; color: #6b6d78; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }

  /* 结果区：流式文本 + 复制 */
  .om-media-res {
    border-top: 1px dashed #d9dae2; margin-top: 2px; padding-top: 6px; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto;
  }
  @media (prefers-color-scheme: dark) { .om-media-res { border-color: #3a3b42; } }
  .om-media-res.om-media-err { color: #d5484f; }
  .om-media-copy {
    border: none; background: none; color: #6841EA; cursor: pointer; font: 12px/1.4 inherit; padding: 0;
  }
  .om-media-copy:hover { text-decoration: underline; }

  /* 嵌入播放器行 */
  .om-media-erow {
    background: #fff; border: 1px solid #e4e4ea; border-radius: 10px; padding: 8px 11px;
    display: flex; align-items: center; gap: 10px; font-size: 12.5px;
  }
  @media (prefers-color-scheme: dark) { .om-media-erow { background: #1e1f24; border-color: #2c2d33; } }
  .om-media-erow .om-media-enote { flex: 1; min-width: 0; color: #6b6d78; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .om-media-erow a { color: #6841EA; text-decoration: none; }
  .om-media-erow a:hover { text-decoration: underline; }

  /* 悬停弹层（单媒体模式，?mode=hover）：隐藏整页面板专属控件，单卡全宽大图，头部加收起钮 */
  body.om-media-hover .om-media-tab,
  body.om-media-hover #om-media-rescan { display: none; }
  body.om-media-hover #om-media-images { grid-template-columns: 1fr; }
  body.om-media-hover .om-media-thumb { height: 220px; }
  .om-media-close {
    border: none; background: none; color: #6b6d78; cursor: pointer;
    font: 14px/1 inherit; padding: 4px 6px; border-radius: 6px;
  }
  .om-media-close:hover { color: #1f2024; background: #eceef2; }
  @media (prefers-color-scheme: dark) { .om-media-close:hover { color: #e6e6ea; background: #2c2d33; } }
</style>
</head>
<body>
<header>
  <strong>网页媒体</strong>
  <span id="om-media-page"></span>
  <span class="om-media-spacer"></span>
  <button class="om-media-tab on" id="om-media-tab-img">图片</button>
  <button class="om-media-tab" id="om-media-tab-vid">视频</button>
  <button class="om-media-tab" id="om-media-tab-embed">嵌入</button>
  <button id="om-media-rescan">重新扫描</button>
</header>
<main>
  <div id="om-media-images" class="om-media-pane"></div>
  <div id="om-media-videos" class="om-media-pane" hidden></div>
  <div id="om-media-embeds" class="om-media-pane" hidden></div>
</main>
<script type="module" src="panel.js"></script>
</body>
</html>
