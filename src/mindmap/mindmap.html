<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维导图 · Vela</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    background: #f6f6f8; color: #1f2024;
  }
  @media (prefers-color-scheme: dark) { body { background: #17181c; color: #e6e6ea; } }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; background: #fff; border-bottom: 1px solid #e4e4ea;
  }
  @media (prefers-color-scheme: dark) { header { background: #1e1f24; border-color: #2c2d33; } }
  #om-mm-title { font-weight: 600; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .om-mm-status { color: #6b6d78; font-size: 12.5px; }
  .om-mm-status.om-mm-err { color: #d5484f; }
  @media (prefers-color-scheme: dark) { .om-mm-status { color: #9a9ca8; } }
  .om-mm-spacer { flex: 1; }
  header button {
    border: 1px solid #d9dae2; background: #fff; color: inherit; border-radius: 6px;
    padding: 5px 12px; font: 12.5px/1 inherit; cursor: pointer;
  }
  header button:hover:not(:disabled) { border-color: #6841EA; color: #6841EA; }
  header button:disabled { opacity: .45; cursor: default; }
  header button.om-mm-primary { background: #6841EA; border-color: #6841EA; color: #fff; }
  header button.om-mm-primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  #om-mm-stop { border-color: #d5484f; color: #d5484f; }
  @media (prefers-color-scheme: dark) {
    header button { background: #26272c; border-color: #3a3b42; }
    header button:hover:not(:disabled) { border-color: #9880F8; color: #9880F8; }
    header button.om-mm-primary { background: #6841EA; color: #fff; }
    header button.om-mm-primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  }

  main { flex: 1; min-height: 0; display: flex; }
  #om-mm-svg { flex: 1; display: block; touch-action: none; cursor: grab; }
  #om-mm-svg.om-mm-panning { cursor: grabbing; }
  #om-mm-svg[hidden] { display: none; }

  #om-mm-input, #om-mm-editor {
    flex: 1; overflow: auto; padding: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #om-mm-input[hidden], #om-mm-editor[hidden] { display: none; }
  .om-mm-card {
    width: min(680px, 100%); background: #fff; border: 1px solid #e4e4ea;
    border-radius: 12px; padding: 18px 20px;
  }
  @media (prefers-color-scheme: dark) { .om-mm-card { background: #1e1f24; border-color: #2c2d33; } }
  .om-mm-card h2 { margin: 0 0 8px; font-size: 15px; }
  .om-mm-hint { margin: 0 0 12px; color: #6b6d78; font-size: 12.5px; }
  @media (prefers-color-scheme: dark) { .om-mm-hint { color: #9a9ca8; } }
  .om-mm-card input, .om-mm-card textarea {
    width: 100%; margin-bottom: 10px; padding: 8px 10px; border: 1px solid #d9dae2;
    border-radius: 8px; background: inherit; color: inherit; font: inherit;
  }
  .om-mm-card textarea { resize: vertical; min-height: 120px; }
  .om-mm-card input:focus, .om-mm-card textarea:focus { outline: 2px solid #6841EA33; border-color: #6841EA; }
  .om-mm-err { color: #d5484f; font-size: 12.5px; }
  .om-mm-btn {
    border: 1px solid #d9dae2; background: #fff; color: inherit; border-radius: 6px;
    padding: 6px 14px; font: 13px/1 inherit; cursor: pointer;
  }
  .om-mm-btn.om-mm-primary { background: #6841EA; border-color: #6841EA; color: #fff; }
  .om-mm-btn:hover:not(:disabled) { border-color: #6841EA; color: #6841EA; }
  .om-mm-btn.om-mm-primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  .om-mm-btn:disabled { opacity: .45; cursor: default; }
  @media (prefers-color-scheme: dark) { .om-mm-btn { background: #26272c; border-color: #3a3b42; } }
  .om-mm-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 本页高亮素材卡：逐段预览 + 单段删除（生成始终由用户显式点击） */
  #om-mm-mat-list { list-style: none; margin: 0 0 12px; padding: 0; max-height: 264px; overflow: auto; }
  #om-mm-mat-list li { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eceef2; }
  @media (prefers-color-scheme: dark) { #om-mm-mat-list li { border-color: #2c2d33; } }
  #om-mm-mat-list .om-mm-m-text {
    flex: 1; min-width: 0; font-size: 13px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #om-mm-mat-list button {
    border: none; background: none; color: #d5484f; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px 7px; border-radius: 4px; flex: none;
  }
  #om-mm-mat-list button:hover { background: rgba(213, 72, 95, .12); }
  #om-mm-mat-list .om-mm-empty { color: #6b6d78; border: none; padding: 6px 0; }

  /* 双击节点就地改名：浮层按节点当前屏幕矩形摆放（跟随平移缩放后的实际位置） */
  #om-mm-rename { position: fixed; z-index: 10; }
  #om-mm-rename input {
    font: 13px system-ui, "Segoe UI", sans-serif; padding: 4px 8px; min-width: 80px;
    border: 2px solid #6841EA; border-radius: 7px; outline: none; background: #fff; color: #1f2024;
  }
  @media (prefers-color-scheme: dark) { #om-mm-rename input { background: #26272c; color: #e6e6ea; } }

  #om-mm-history { list-style: none; margin: 0; padding: 0; }
  #om-mm-history li {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid #eceef2;
  }
  @media (prefers-color-scheme: dark) { #om-mm-history li { border-color: #2c2d33; } }
  #om-mm-history .om-mm-h-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #om-mm-history .om-mm-h-meta { color: #6b6d78; font-size: 12px; white-space: nowrap; }
  #om-mm-history button {
    border: 1px solid #d9dae2; background: none; color: #6841EA; border-radius: 6px;
    padding: 3px 10px; font-size: 12.5px; cursor: pointer;
  }
  #om-mm-history button:hover { border-color: #6841EA; }
  #om-mm-history .om-mm-empty { color: #6b6d78; padding: 8px 0; }

  /* SVG 节点：text 用 currentColor，配色走内联（分支色随树分配） */
  .om-mm-node text { fill: currentColor; font: 13px system-ui, "Segoe UI", sans-serif; }
  .om-mm-node.om-mm-root text { fill: #fff; font-weight: 600; font-size: 14px; }
  .om-mm-node.om-mm-branch text { font-weight: 600; }
  /* 出处角标（〔片段n〕/〔§小节名〕）：小字灰色，不抢主体注意力 */
  .om-mm-node tspan.om-mm-ref { font: 11px system-ui, "Segoe UI", sans-serif; fill: #8f91a0; }
  .om-mm-node.om-mm-root tspan.om-mm-ref { fill: #cfcedd; }
  .om-mm-node.om-mm-foldable { cursor: pointer; }
  .om-mm-node.om-mm-foldable:hover rect { filter: brightness(.96); }
</style>
</head>
<body>
<header>
  <button id="om-mm-back" hidden title="回到「新导图」之前的那张导图">‹ 返回导图</button>
  <strong id="om-mm-title">思维导图</strong>
  <span id="om-mm-status" class="om-mm-status"></span>
  <span class="om-mm-spacer"></span>
  <button id="om-mm-stop" hidden>停止</button>
  <button id="om-mm-mode-mat" hidden title="本页高亮素材导图：有旧图直接打开，没有则点击生成">高亮导图</button>
  <button id="om-mm-mode-full" hidden title="不看高亮，把整篇网页正文整理成思维导图：有旧图直接打开，没有则点击生成">整页导图</button>
  <button id="om-mm-regen" hidden title="按当前模式（高亮素材 / 整页正文）重新生成">重新生成</button>
  <button id="om-mm-edit" hidden title="直接编辑 markdown 大纲（增删节点 / 调结构 / 改标题）">编辑大纲</button>
  <button id="om-mm-fit">适配视图</button>
  <button id="om-mm-fold">全部折叠</button>
  <button id="om-mm-unfold">全部展开</button>
  <button id="om-mm-exp-md" disabled>导出 Markdown</button>
  <button id="om-mm-exp-mm" disabled>导出 FreeMind</button>
  <button id="om-mm-new" title="清空画布另起一张（粘贴内容生成）；刚才的导图已存历史，可点「‹ 返回导图」回去">新导图</button>
  <button id="om-mm-mat" hidden title="查看/管理本页收集的高亮素材">素材</button>
</header>
<main>
  <svg id="om-mm-svg" xmlns="http://www.w3.org/2000/svg" hidden></svg>
  <section id="om-mm-input" hidden>
    <div class="om-mm-card" id="om-mm-page-card" hidden>
      <h2>本页高亮素材</h2>
      <p class="om-mm-hint" id="om-mm-mat-hint">在网页上划词点「高亮」即可收集素材；收集够了点下面的按钮，由 LLM 结合网页正文的理解把高亮片段整理成一篇思维导图。</p>
      <ul id="om-mm-mat-list"></ul>
      <div class="om-mm-btn-row">
        <button id="om-mm-mat-run" class="om-mm-btn om-mm-primary">生成思维导图</button>
        <button id="om-mm-full-run" class="om-mm-btn" title="不看高亮，把整篇网页正文整理成思维导图">用整页正文生成</button>
      </div>
      <p id="om-mm-mat-err" class="om-mm-err" hidden></p>
    </div>
    <div class="om-mm-card">
      <h2>生成思维导图</h2>
      <p class="om-mm-hint">不用网页素材时，也可以直接粘贴内容生成。</p>
      <input id="om-mm-in-title" placeholder="主题（可选，作导图中心标题）" maxlength="80">
      <textarea id="om-mm-in-text" rows="9" placeholder="粘贴要整理成思维导图的内容…"></textarea>
      <button id="om-mm-in-run" class="om-mm-btn om-mm-primary">生成思维导图</button>
      <p id="om-mm-in-err" class="om-mm-err" hidden></p>
    </div>
    <div class="om-mm-card">
      <h2>历史导图</h2>
      <ul id="om-mm-history"></ul>
    </div>
  </section>
  <section id="om-mm-editor" hidden>
    <div class="om-mm-card">
      <h2>编辑大纲</h2>
      <p class="om-mm-hint">直接改 markdown：首行「# 」是中心标题，一级条目是分支，子级每行多缩进 2 个空格。应用后立即重新渲染并保存；也可以双击画布节点就地改名。</p>
      <textarea id="om-mm-ed-text" rows="18" spellcheck="false"></textarea>
      <button id="om-mm-ed-apply" class="om-mm-btn om-mm-primary">应用</button>
      <button id="om-mm-ed-cancel" class="om-mm-btn">取消</button>
      <p id="om-mm-ed-err" class="om-mm-err" hidden></p>
    </div>
  </section>
</main>
<script type="module" src="mindmap.js"></script>
</body>
</html>
